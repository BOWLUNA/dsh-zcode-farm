# 测试矩阵。六道守卫全跑 —— 本仓库真的因为「改了数字忘重录配对哈希」让整片矩阵红过一次，
# 也真的因为「解析 TAP 没钉 reporter」让 node-24 的腿连续红过四次（见 tools/boot-check.sh 与
# test/run.mjs 的文件头注释）。最近补上的是第 6 道：真装 + 真启动。
#
# `tools/verify-version-consistency.mjs` 会从本文件里读**第一个** `@deepseek-ai/dsh@<version>` 的钉定，
# 断言它落在 `package.json` 的 `engines.dsh` 范围里。CI 里传的是 `--dsh ${{ matrix.dsh }}`。
#
# 四条 dsh 线 —— 矩阵里一共 5 条腿（`0.1.6-alpha.2` 那条在 node 20/24 各跑一次）：
#   0.1.5-rc.2      声明范围的下界
#   0.1.5-rc.3      ★ npm 的 `latest` 标签当前值 —— 也就是**用户不指定版本时实际装到的那个**。
#                   加它的理由不是"多发一条腿"，而是：范围声明覆盖它、却从来没有跑过它，
#                   等于在测一个没人装的组合、同时把没人验过的组合发出去。
#                   2026-09-24 在 DSHTEST/_v015rc3（真 0.1.5-rc.3 + pnpm 12.6.0 + node 22.22.2）实测：
#                   `plugin add` exit 0 / `--dump-config` exit 0 · 542 行 · stderr 0 字节 /
#                   真启动 t=3000·5000ms 应答 · stderr 0 字节 / 收工端口已释放；
#                   `boot-check.mjs` 四条断言 A/B/C/D 全 PASS。
#                   ⚠️ 下面这几行注释里**故意不写** `@deepseek-ai/dsh@<版本>` 这种字面量 ——
#                   `tools/verify-version-consistency.mjs` 用正则抓本文件里**第一个**这种字面量
#                   当作"CI 钉的版本"，在注释里写版本号会**静默改变**那条断言的标的。
#   0.1.6-alpha.2   ← 脚本会读到的那一条（本仓库开发期一直用它）
#   0.1.7-alpha.2   npm 的 alpha 标签当前值。2026-09-23 实测过：能装能起、
#                   **工具注册 3/3**、stderr 0 字节（探针见 DSHTEST/farm/probe-017.log）。
#                   它必须同时出现在 engines.dsh 里 —— 否则本脚本会判定 CI 钉的版本
#                   落在声明之外，而那正是它该抓的事。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20', '24']
        dsh: ['0.1.6-alpha.2']
        include:
          - os: ubuntu-latest
            node-version: '24'
            dsh: '0.1.5-rc.2'
          # ★ npm `latest`。范围声明覆盖它，此前却从没在它上面跑过 —— 声明说了真话、没人验过。
          - os: ubuntu-latest
            node-version: '24'
            dsh: '0.1.5-rc.3'
          - os: ubuntu-latest
            node-version: '24'
            dsh: '0.1.7-alpha.2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 装宿主（只为让 peer 能被解析；插件本身零运行时依赖）
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}

      # `dsh plugin` 会去 PATH 上找 pnpm 来管理 profile 的插件，找不到就直接报
      # 「pnpm not found on PATH — install pnpm to manage profile plugins」。
      # 本机的开发环境一直有 pnpm，所以第 6 道守卫第一次上 CI 才发现这个前提没被写下来。
      - name: 装 pnpm（`dsh plugin` 需要它在 PATH 上）
        run: npm install -g --no-audit --no-fund pnpm@12

      - name: 1) 测试与检查数
        run: node test/run.mjs

      - name: 2) 双语配对
        run: node tools/verify-translation-pairing.mjs

      - name: 3) 文档数字
        run: node tools/verify-doc-numbers.mjs

      - name: 4) shell 语法
        run: bash -n install.sh && bash -n uninstall.sh

      - name: 5) 版本一致性
        run: node tools/verify-version-consistency.mjs --dsh ${{ matrix.dsh }}

      # ★ 真装 + 真启动。**这是唯一能抓「装得上但起不来」的守卫。**
      #
      #   为什么前面五道抓不到：`--dump-config` 只合成配置、不 apply 插件 ——
      #   行的 `name` 解析失败时它**不报错**，只是不打印 `packageDir`。
      #   实测（2026-09-21，本仓库的变异副本）：把 `cordis.patch.yml` 的行 name 改成
      #   解析不到的旧名之后，`--dump-config` 依然 exit 0 / stderr 0，
      #   而真启动 exit 1 / **stderr 5673 字节** / `ERR_MODULE_NOT_FOUND`。
      #   兄弟仓库 `dsh-zcode-scribe` 就是靠这个机制在发布后炸的（stderr 7231 字节）。
      #
      #   这一步本身也做过双向验证：注入上面那个变异 ⇒ 红；还原 ⇒ 绿。
      #   没有做过双向验证的守卫等于没有守卫。
      #
      #   规范形态见 tools/boot-check.mjs 的文件头：四条断言 A/B/C/D，
      #   断言 C 落在「端口是否应答」而不是「打印了监听 URL」（后者是版本相关的 ——
      #   dsh 0.1.5-rc.2 启动成功却 stdout 零字节）。
      #
      #   ⚠️ 只在 node >= 22 的腿上跑：harness 的依赖树里有包要求 node >= 22.19.0
      #   （undici / @deepseek-ai/libreoffice-kit / @earendil-works/pi-ai），
      #   实测 node 20 上 `npm install @deepseek-ai/dsh@0.1.6-alpha.2` 只装入 **10** 个包
      #   （node 24 上是 488–520 个）、装不出 `node_modules/.bin/dsh`。
      #   见 AGENTS.md 的「Facts that are easy to get wrong」最后一条。
      - name: 6) 真启动（装得上 + 起得来）
        if: matrix.node-version != '20'
        run: node tools/boot-check.mjs --port 31841

      - name: 6) 跳过说明（本腿装不出宿主）
        if: matrix.node-version == '20'
        run: |
          echo "::warning::本腿（node ${{ matrix.node-version }}）跳过了第 6 道守卫 —— 它装不出宿主。" \
               "实测 node 20 上 npm install @deepseek-ai/dsh 只装入 10 个包、没有 node_modules/.bin/dsh；" \
               "harness 的依赖树要求 node >= 22.19.0。前 5 道仍然照跑。见 AGENTS.md 的同条说明。"
