    <text x="40" y="274" font-size="10.5" fill="#8A5A3B" font-weight="600">same answer for every weight: gpu-18303</text>
    <rect x="350" y="92" width="304" height="196" fill="#FFFFFF" stroke="#E2D9C6" rx="6"/>
    <text x="364" y="116" font-size="12.5" font-weight="600">B · where the two rules disagree (constructed)</text>
    <line x1="396" y1="234" x2="596" y2="234" stroke="#E2D9C6"/>
    <text x="356" y="158" font-size="10" fill="#6C655B">20</text>
    <text x="356" y="206" font-size="10" fill="#6C655B">8</text>
    <text x="356" y="238" font-size="10" fill="#6C655B">0</text>
    <line x1="396" y1="154" x2="596" y2="274" stroke="#B07A52" stroke-width="1.6"/>
    <line x1="396" y1="202" x2="596" y2="202" stroke="#77854F" stroke-width="1.6"/>
    <circle cx="476" cy="202" r="3.4" fill="#FFFFFF" stroke="#35322E" stroke-width="1.4"/>
    <line x1="476" y1="202" x2="476" y2="260" stroke="#35322E" stroke-dasharray="3 3" stroke-width="1"/>
    <text x="460" y="270" font-size="10" fill="#35322E">crossover = 12</text>
    <text x="396" y="270" font-size="10" fill="#6C655B">weight 0</text>
    <text x="578" y="270" font-size="10" fill="#6C655B">30</text>
    <text x="364" y="248" font-size="10" fill="#B07A52">A: 20 − w</text>
    <text x="446" y="248" font-size="10" fill="#5F6B3E">B: 8</text>
    <text x="364" y="270" font-size="10" fill="#6C655B">w=11.9 → A · w=12.1 → B</text>
    <text x="500" y="116" font-size="10" fill="#6C655B">chosen: A / B</text>
    <text x="26" y="356" font-size="10" fill="#8A8378">Every number here is computed from the measured fixture by tools/ordering-replay.mjs</text>
  </g>
